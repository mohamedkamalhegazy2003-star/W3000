name: Build WPDF APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download OCR data and Arabic fonts
        run: |
          mkdir -p assets/tessdata assets/fonts
          curl -fL -o assets/tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          curl -fL -o assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -fL -o assets/fonts/Amiri-Regular.ttf https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf
          curl -fL -o assets/fonts/Amiri-Bold.ttf https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf
          ls -la assets/tessdata assets/fonts

      - name: Generate Android project
        run: |
          flutter create --org com.wpdf --project-name wpdf --platforms android .
          python3 tools/patch_android.py
          rm -rf test

      - name: Pub get
        shell: bash
        run: flutter pub get 2>&1 | tee build.log

      - name: Analyze
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log

      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee -a build.log

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk WPDF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WPDF-apk
          path: WPDF.apk

      - name: Publish release
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WPDF.apk --title "WPDF APK" --notes "Latest build" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Push build log
        if: always()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log || echo "no log" > /tmp/logs/build.log
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/logs/build.log build.log
          git add build.log
          git commit -m "build log"
          git push -f origin ci-logs
