name: wpdf
description: WPDF - قارئ ومحرر PDF مع OCR عربي/إنجليزي وترجمة ووضع الكتاب.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdfrx: 2.4.6
  pdf: ^3.11.0
  image: ^4.2.0
  shared_preferences: ^2.3.0
  file_picker: ^10.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  share_plus: ^11.0.0
  flutter_displaymode: ^0.6.0
  google_mlkit_translation: ^0.13.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/tessdata/
    - assets/fonts/
